name: Homelab Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: homelab-android-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      RVX_SENTRY_DSN: ""
      RVX_BUILD_FLAVOUR_ID: HOME
      RVX_DEBUG_APP_NAME: Stoat Homelab

    steps:
      - name: Checkout homelab branch
        uses: actions/checkout@v6
        with:
          ref: homelab
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare local build configuration
        shell: bash
        run: |
          cat > stoatbuild.properties <<'EOF'
          sentry.dsn=
          sentry.upload_mappings=false
          build.debug.app_name=Stoat Homelab
          build.flavour_id=HOME
          EOF

          cp app/google-services.json.example app/google-services.json

          sed -i \
            's#chat\.revolt\.debug#io.github.yperfectbr.stoathomelab.debug#g;
             s#chat\.revolt#io.github.yperfectbr.stoathomelab#g' \
            app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "RVX_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RVX_RELEASE_VERSION_CODE=$((2000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew clean :app:assembleDebug --no-daemon

      - name: Verify APK identity
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "^(package:|application-label:)"

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            release-assets/Stoat-Homelab-android-debug.apk

          sha256sum release-assets/Stoat-Homelab-android-debug.apk \
            > release-assets/Stoat-Homelab-android-debug.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homelab branch
        uses: actions/checkout@v6
        with:
          ref: homelab

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: android-debug-apk
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="homelab-v${VERSION}"

          args=(
            "$tag"
            --target homelab
            --title "Stoat Homelab Android v${VERSION}"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" release-assets/*
